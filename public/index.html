<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freelancer System Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2354a3ff'/%3E%3Cellipse cx='16' cy='16' rx='15' ry='5' fill='none' stroke='%23ffd34d' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo"></span><b>FL System Editor</b></div>
    <nav id="menus"></nav>
    <div class="spacer"></div>
    <div id="docstate"></div>
  </header>
  <aside id="left">
    <div class="tabs" id="lefttabs">
      <button data-tab="outliner" class="on">Outliner</button>
      <button data-tab="systems">Systems</button>
    </div>
    <div class="tabbody" id="tab-outliner"></div>
    <div class="tabbody hidden" id="tab-systems"></div>
  </aside>
  <main id="center">
    <div id="viewtabs">
      <button data-view="system" class="on">System</button>
      <button data-view="universe">Universe map</button>
      <div class="spacer"></div>
      <div id="toolstrip"></div>
    </div>
    <div id="viewport"></div>
    <div id="universe" class="hidden"><canvas id="unicanvas"></canvas><div id="unihud"></div></div>
    <div id="hud"></div>
  </main>
  <aside id="right"><div id="props"></div></aside>
  <footer id="status"><span id="st-msg">Starting…</span><span class="spacer"></span><span id="st-sel"></span><span id="st-cursor"></span></footer>
</div>
<div id="overlay" class="hidden"><div id="overlay-box"><div class="spinner"></div><div id="overlay-text">Loading…</div></div></div>
<div id="modal-root"></div>
<div id="ctxmenu" class="hidden"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
